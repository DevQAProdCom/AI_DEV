# Starter pipeline with Copilot & Azure CLI install + Copilot agent run
# Add/adjust steps as your project requires

trigger: none
resources:
  webhooks:
    - webhook: BoardsTrigger             
      connection: BoardsTriggerServiceConnectionName

jobs:
- job: RunCopilotTasks
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - script: |
      set -e
      echo "=== Dump webhook step-level env vars and resource ==="
      echo "WEBHOOK_RESOURCE: '$WEBHOOK_RESOURCE'"
      echo "WORKITEM_ID: '$WORKITEM_ID'"
      echo "WORKITEM_TITLE: '$WORKITEM_TITLE'"
      echo "WORKITEM_STATE: '$WORKITEM_STATE'"
      echo
      echo "=== printenv (sorted) ==="
      printenv | sort
    displayName: 'Dump webhook context'
    env:
      WEBHOOK_RESOURCE: $[ resources.webhooks.BoardsTrigger.resource ]
      WORKITEM_ID: $[ resources.webhooks.BoardsTrigger.resource.fields['System.Id'] ]
      WORKITEM_TITLE: $[ resources.webhooks.BoardsTrigger.resource.fields['System.Title'] ]
      WORKITEM_STATE: $[ resources.webhooks.BoardsTrigger.resource.fields['System.State'] ]

  - script: |
      echo "Processing Work Item ID: $WORKITEM_ID"
      echo "The Title is: $WORKITEM_TITLE"
      echo "Current Status: $WORKITEM_STATE"
    displayName: 'Echo WebHook Data'
    env:
      WORKITEM_ID: $[ resources.webhooks.BoardsTrigger.resource.fields['System.Id'] ]
      WORKITEM_TITLE: $[ resources.webhooks.BoardsTrigger.resource.fields['System.Title'] ]
      WORKITEM_STATE: $[ resources.webhooks.BoardsTrigger.resource.fields['System.State'] ]

  # Install prerequisites (curl, sudo present on ubuntu-latest)
  - script: |
      set -e
      echo "Installing Azure CLI..."
      curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
    displayName: 'Install Azure CLI'

  # Install GitHub Copilot CLI using official install script
  - script: |
      set -e
      echo "Installing GitHub Copilot CLI using official install script..."
      curl -fsSL https://gh.io/copilot-install | sudo bash
    displayName: 'Install GitHub Copilot CLI'

  # Add azure-devops extension
  - script: |
      set -e
      echo "Adding azure-devops extension to az..."
      az extension add --name azure-devops
      echo $(AZURE_DEVOPS_TOKEN) | az devops login --organization https://dev.azure.com/DevQAProdCom
    displayName: 'az extension add azure-devops'

  # Validate/normalize WorkItemId and run Copilot agent from agents/Task_Developer
  - script: |
      set -e
      echo "WorkItemId parameter: '$WORKITEM_ID'"

      if [ -z "$WORKITEM_ID" ] || [ "$WORKITEM_ID" = 'Not Set' ]; then
        echo "WorkItemId not set; using 'Not Set' placeholder"
        WORK_ITEM='Not Set'
      else
        # Trim possible quotes and validate numeric
        WI_RAW="$WORKITEM_ID"
        WI_TRIMMED=$(echo "$WI_RAW" | tr -d '"')
        if ! echo "$WI_TRIMMED" | grep -E '^[0-9]+$' > /dev/null; then
          echo "Provided WorkItemId is not numeric: $WI_TRIMMED"
          # continue — WorkItemId may not be numeric for some webhook types
          WORK_ITEM="$WI_TRIMMED"
        else
          WORK_ITEM="$WI_TRIMMED"
          echo "Using WorkItemId: $WORK_ITEM"
        fi
      fi

      # Export as env var for the agent if it reads it
      export WORK_ITEM_ID="$WORK_ITEM"

      echo "Creating webhook payload file 'webhook_payload.json'"
      # If jq exists, pretty-print; otherwise write raw
      if command -v jq >/dev/null 2>&1; then
        echo "$WEBHOOK_RESOURCE" | jq . > webhook_payload.json || echo "$WEBHOOK_RESOURCE" > webhook_payload.json
      else
        echo "$WEBHOOK_RESOURCE" > webhook_payload.json
      fi

      echo "=== webhook_payload.json (head 2KB) ==="
      head -c 2048 webhook_payload.json || true
      echo "\n=== end head ==="

      # Expose payload path and run Copilot agent with full payload as prompt
      PAYLOAD=$(cat webhook_payload.json)
      echo "Running Copilot agent 'Task_Developer' with webhook payload as prompt"
      copilot --agent task-developer --allow-all-tools -p "Webhook payload: $PAYLOAD"
    displayName: 'Run Copilot agent Task_Developer'
    env:
      # ensure az + npm commands can find auth tokens if set as pipeline variables/secrets
      GITHUB_TOKEN: $(GITHUB_TOKEN)
      WORKITEM_ID: $[ resources.webhooks.BoardsTrigger.resource.fields['System.Id'] ]
      WORKITEM_TITLE: $[ resources.webhooks.BoardsTrigger.resource.fields['System.Title'] ]
      WORKITEM_STATE: $[ resources.webhooks.BoardsTrigger.resource.fields['System.State'] ]
      WEBHOOK_RESOURCE: $[ resources.webhooks.BoardsTrigger.resource ]

  # Add any additional build/test steps below
  - script: |
      echo "Pipeline finished. Add build/test/deploy steps as needed."
    displayName: 'Placeholder end step'
