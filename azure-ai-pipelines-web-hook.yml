# Starter pipeline with Copilot & Azure CLI install + Copilot agent run
# Add/adjust steps as your project requires

trigger: none
resources:
  webhooks:
    - webhook: BoardsTrigger             
      connection: BoardsTriggerServiceConnectionName

jobs:
- job: RunCopilotTasks
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  # Dump every RESOURCES_* env var Azure Pipelines injects and the scalar fields we map
  - script: |
      echo "=== Scalar webhook fields mapped via expressions ==="
      echo "WORKITEM_ID (resource.workItemId): '$WORKITEM_ID'"
      echo "EVENT_TYPE (eventType):            '$EVENT_TYPE'"
      echo "SUBSCRIPTION_ID (subscriptionId):  '$SUBSCRIPTION_ID'"
      echo
      echo "=== All RESOURCES_* env vars injected by Azure Pipelines ==="
      printenv | grep -i RESOURCES_ | sort || true
      echo
      echo "=== Full printenv (sorted) ==="
      printenv | sort
    displayName: 'Dump webhook context'
    env:
      WORKITEM_ID:     $[ resources.webhooks.BoardsTrigger.resource.workItemId ]
      EVENT_TYPE:      $[ resources.webhooks.BoardsTrigger.eventType ]
      SUBSCRIPTION_ID: $[ resources.webhooks.BoardsTrigger.subscriptionId ]

  # Install prerequisites (curl, sudo present on ubuntu-latest)
  - script: |
      set -e
      echo "Installing Azure CLI..."
      curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
    displayName: 'Install Azure CLI'

  # Install GitHub Copilot CLI using official install script
  - script: |
      set -e
      echo "Installing GitHub Copilot CLI using official install script..."
      curl -fsSL https://gh.io/copilot-install | sudo bash
    displayName: 'Install GitHub Copilot CLI'

  # Add azure-devops extension
  - script: |
      set -e
      echo "Adding azure-devops extension to az..."
      az extension add --name azure-devops
      echo $(AZURE_DEVOPS_TOKEN) | az devops login --organization https://dev.azure.com/DevQAProdCom
    displayName: 'az extension add azure-devops'

  # Fetch full work item JSON from Azure DevOps and pass to Copilot agent
  - script: |
      set -e
      echo "WORKITEM_ID: '$WORKITEM_ID'"

      if [ -z "$WORKITEM_ID" ]; then
        echo "ERROR: WORKITEM_ID is empty — webhook may not have carried resource.workItemId"
        exit 1
      fi

      echo "=== Fetching full work item JSON ==="
      az boards work-item show --id "$WORKITEM_ID" --output json | tee workitem.json
      echo
      echo "=== workitem.json ==="
      cat workitem.json

      PAYLOAD=$(cat workitem.json)
      echo "Running Copilot agent 'Task_Developer' with full work item payload"
      copilot --agent task-developer --allow-all-tools -p "Work item payload: $PAYLOAD"
    displayName: 'Run Copilot agent Task_Developer'
    env:
      GITHUB_TOKEN: $(GITHUB_TOKEN)
      WORKITEM_ID: $[ resources.webhooks.BoardsTrigger.resource.workItemId ]

  # Add any additional build/test steps below
  - script: |
      echo "Pipeline finished. Add build/test/deploy steps as needed."
    displayName: 'Placeholder end step'

