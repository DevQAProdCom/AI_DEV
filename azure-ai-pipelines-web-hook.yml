# Starter pipeline with Copilot & Azure CLI install + Copilot agent run
# Add/adjust steps as your project requires

trigger: none
resources:
  webhooks:
    - webhook: BoardsTrigger             
      connection: BoardsTriggerServiceConnectionName

jobs:
- job: RunCopilotTasks
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  # FIRST: dump the full raw webhook JSON body before any other work
  - script: |
      echo "========================================================"
      echo "=== STEP 1: Raw webhook payload (full JSON)          ==="
      echo "========================================================"
      echo "$WEBHOOK_PAYLOAD"
      echo
      echo "========================================================"
      echo "=== STEP 2: Pretty-printed (jq)                      ==="
      echo "========================================================"
      echo "$WEBHOOK_PAYLOAD" | jq . || echo "(jq parse failed — raw above)"
      echo
      echo "========================================================"
      echo "=== STEP 3: Key fields extracted                     ==="
      echo "========================================================"
      echo "workItemId:  $(echo "$WEBHOOK_PAYLOAD" | jq -r '.id // .workItemId // empty')"
      echo "eventType:   $(echo "$WEBHOOK_PAYLOAD" | jq -r '.eventType // empty')"
      echo "title:       $(echo "$WEBHOOK_PAYLOAD" | jq -r '.fields["System.Title"] // .resource.fields["System.Title"] // empty')"
      echo "state:       $(echo "$WEBHOOK_PAYLOAD" | jq -r '.fields["System.State"] // .resource.fields["System.State"] // empty')"
      echo
      echo "========================================================"
      echo "=== STEP 4: All printenv (sorted)                    ==="
      echo "========================================================"
      printenv | sort
    displayName: 'Dump full webhook context'
    env:
      # convertToJson serialises the resource object to a JSON string
      WEBHOOK_PAYLOAD: ${{ convertToJson(parameters.BoardsTrigger.resource) }}

  # Install prerequisites (curl, sudo present on ubuntu-latest)
  - script: |
      set -e
      echo "Installing Azure CLI..."
      curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
    displayName: 'Install Azure CLI'

  # Install GitHub Copilot CLI using official install script
  - script: |
      set -e
      echo "Installing GitHub Copilot CLI using official install script..."
      curl -fsSL https://gh.io/copilot-install | sudo bash
    displayName: 'Install GitHub Copilot CLI'

  # Add azure-devops extension
  - script: |
      set -e
      echo "Adding azure-devops extension to az..."
      az extension add --name azure-devops
      echo $(AZURE_DEVOPS_TOKEN) | az devops login --organization https://dev.azure.com/DevQAProdCom
    displayName: 'az extension add azure-devops'

  # Extract workItemId from payload, fetch full work item, pass to Copilot agent
  - script: |
      set -e
      echo "Raw payload snippet: $(echo "$WEBHOOK_PAYLOAD" | head -c 200)"

      # Extract work item ID from the JSON payload
      WORK_ITEM_ID=$(echo "$WEBHOOK_PAYLOAD" | jq -r '.id // .workItemId // .resource.id // .resource.workItemId // empty')
      echo "Extracted WORK_ITEM_ID: '$WORK_ITEM_ID'"

      if [ -z "$WORK_ITEM_ID" ] || [ "$WORK_ITEM_ID" = "null" ]; then
        echo "ERROR: could not extract workItemId from payload — see Dump step above"
        exit 1
      fi

      echo "=== Fetching full work item JSON from Azure DevOps ==="
      az boards work-item show --id "$WORK_ITEM_ID" --output json | tee workitem.json

      FULL_WORK_ITEM=$(cat workitem.json)
      echo "Running Copilot agent 'Task_Developer' with full work item payload"
      copilot --agent task-developer --allow-all-tools -p "Work item JSON: $FULL_WORK_ITEM"
    displayName: 'Run Copilot agent Task_Developer'
    env:
      GITHUB_TOKEN: $(GITHUB_TOKEN)
      WEBHOOK_PAYLOAD: ${{ convertToJson(parameters.BoardsTrigger.resource) }}

  # Add any additional build/test steps below
  - script: |
      echo "Pipeline finished. Add build/test/deploy steps as needed."
    displayName: 'Placeholder end step'
